# PRO_CPU (core 0) - sensor core: LD2402 on UART1 + IPM tx to APP_CPU

CONFIG_PRINTK=y
CONFIG_SERIAL=y
CONFIG_MAIN_STACK_SIZE=4096

# LD2402 RX path: UART interrupt + ring buffer (see CONFIG_LD2402_RX_POLLING)
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_RING_BUFFER=y

# BOOT button (alias calib-button) for auto threshold calibration
CONFIG_GPIO=y

# Inter-core link. CONFIG_IPM also makes PRO_CPU load and start APP_CPU.
CONFIG_IPM=y
CONFIG_ESP32_SOFT_IPM=y

# log10f() for gate energy -> dB (ESP32-S3 has a hardware FPU)
CONFIG_FPU=y
