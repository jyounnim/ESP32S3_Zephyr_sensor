# APP_CPU (core 1) - display core: SSD1306 (raw I2C driver) on I2C1 + IPM rx
# Same base config as the hardware-verified multi-sensor AMP Lab 01 core1 image.
# Note: APP_CPU has no console UART, printk/LOG output is not visible.

CONFIG_I2C=y
CONFIG_GPIO=y

CONFIG_IPM=y
CONFIG_ESP32_SOFT_IPM=y

# ssd1306_display.c uses LOG_MODULE_REGISTER
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y

CONFIG_MAIN_STACK_SIZE=4096
